# Builds the project and runs all tests on every push and pull request to main
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # Ubuntu runners have Docker preinstalled, which Testcontainers needs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify
