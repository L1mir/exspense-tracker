# Whole service:      docker compose up --build    (API key from TWELVEDATA_API_KEY or a .env file)
# Only DB for local development: docker compose up -d postgres
services:
  postgres:
    image: postgres:17-alpine
    container_name: expense-tracker-postgres
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/create-readonly-user.sql:/docker-entrypoint-initdb.d/create-readonly-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: expense-tracker-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/expense_tracker
      SPRING_DATASOURCE_USERNAME: expense
      SPRING_DATASOURCE_PASSWORD: expense
      TWELVEDATA_API_KEY: ${TWELVEDATA_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

volumes:
  postgres-data:
