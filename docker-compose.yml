# Local infrastructure for the dev profile: `docker compose up -d`
# Values can be overridden in a .env file next to this one (see .env.example).
services:
  postgres:
    image: postgres:17-alpine
    container_name: expense-tracker-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-expense_tracker}
      POSTGRES_USER: ${DB_USERNAME:-expense}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-expense}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
