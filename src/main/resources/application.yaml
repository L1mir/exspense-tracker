# Common settings for all profiles. Environment-specific values live in application-<profile>.yaml
# and are overridden by environment variables (DB_HOST, DB_PASSWORD, ...).
spring:
  application:
    name: expense-tracker
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expense_tracker}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations; Hibernate only checks that entities match it
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logbook:
  predicate:
    exclude:
      - path: /v3/api-docs/**
      - path: /swagger-ui/**
  format:
    style: json

logging:
  level:
    # Logbook writes HTTP exchanges at TRACE level
    org.zalando.logbook.Logbook: TRACE
