spring:
  application:
    name: expense-tracker
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  # Local docker-compose DB; elsewhere override with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_tracker
    username: expense
    password: expense
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: true
  web:
    locale: en
    locale-resolver: fixed

app:
  time-zone: Asia/Almaty
  default-limit: 1000.00
  twelve-data:
    base-url: https://api.twelvedata.com
    # Secret: set the TWELVEDATA_API_KEY environment variable, never commit the key
    api-key: ${TWELVEDATA_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s
    max-retries: 2
    retry-delay: 500ms
