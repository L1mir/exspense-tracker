spring:
  application:
    name: expense-tracker
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  # Local database from docker-compose.yml.
  # In other environments override with SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/expense_tracker
    username: expense
    password: expense
  jpa:
    open-in-view: false
    hibernate:
      # Schema is created by Flyway migrations; Hibernate only checks that entities match it
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    problemdetails:
      enabled: true

app:
  # Month boundaries and the transaction day are calculated in this time zone
  time-zone: Asia/Almaty
  # Monthly limit in USD when the client has not set one
  default-limit: 1000.00
  twelve-data:
    base-url: https://api.twelvedata.com
    # Secret: set the TWELVEDATA_API_KEY environment variable, never commit the key
    api-key: ${TWELVEDATA_API_KEY:}
    connect-timeout: 2s
    read-timeout: 5s
    # Retries after the first failed attempt; the delay doubles each time (500ms, 1s)
    max-retries: 2
    retry-delay: 500ms
